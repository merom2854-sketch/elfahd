name: Monitor content source

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/monitor-sources.mjs
      - name: Persist a source state change
        run: |
          if ! git diff --quiet; then
            git config user.name "Al Fahd source monitor"
            git config user.email "actions@users.noreply.github.com"
            git add data/source-health.json data/notifications.json
            git commit -m "monitor: update source health"
            git push
          fi
