apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.alfahdtv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alfahdtv.app'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '3.0.1'
        buildConfigField 'String', 'HOME_URL', '"https://elfahd-tv.vercel.app/#/home"'
        buildConfigField 'String', 'ALLOWED_HOST', '"elfahd-tv.vercel.app"'
    }

    signingConfigs {
        migrationRelease {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            // Keep the installed package and certificate so v1.x users receive this as an update.
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.migrationRelease
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.8'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.animation:animation:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.material:material-icons-extended:1.6.8'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Media3 is bundled as local AARs, so its Guava classes must be declared explicitly.
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

configurations.configureEach {
    resolutionStrategy.force 'androidx.annotation:annotation:1.8.2'
    resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:2.8.2'
}
