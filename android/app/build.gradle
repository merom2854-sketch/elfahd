apply plugin: 'com.android.application'

android {
    namespace 'com.alfahdtv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alfahdtv.app'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '2.0.1'
        buildConfigField 'String', 'HOME_URL', '"https://elfahd-tv.vercel.app/#/home"'
        buildConfigField 'String', 'ALLOWED_HOST', '"elfahd-tv.vercel.app"'
    }

    signingConfigs {
        migrationRelease {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            // Keep the installed package and certificate so v1.x users receive this as an update.
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.migrationRelease
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
