<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>الفهد TV</title>
  <style>
    :root{--bg:#08090d;--panel:#12141b;--soft:#1a1d27;--text:#fff;--muted:#a7a9b2;--gold:#f2b640;--red:#e7192d;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}button{font:inherit;color:inherit}.hidden{display:none!important}
    .app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:84px;background:radial-gradient(ellipse at 85% 0,#2b1711 0%,transparent 30%),var(--bg)}
    .top{height:67px;position:sticky;top:0;z-index:15;padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#08090df5,#08090dc9,transparent);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:9px;font-weight:900}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f5c95b,#b77a15);color:#160e00;font-size:22px;box-shadow:0 7px 22px #b77a1545}.actions{display:flex;gap:7px}.icon{border:0;background:#ffffff0b;border:1px solid var(--line);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;cursor:pointer}
    .hero{height:420px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#3a1d10,#101722 52%,#08090d)}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 62%),linear-gradient(90deg,#08090dcb,transparent 72%)}.hero-art{position:absolute;inset:0;opacity:.6;background:radial-gradient(circle at 68% 37%,#efb347 0 5%,transparent 5.3%),radial-gradient(ellipse at 76% 54%,#7d3d16 0 22%,transparent 22.5%),linear-gradient(125deg,transparent 25%,#bc701d66 25% 40%,transparent 40%);filter:blur(.2px)}
    .hero-copy{position:absolute;z-index:1;bottom:27px;right:20px;left:20px}.tag{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border:1px solid #ffffff22;border-radius:30px;background:#0006;color:#f8d88d;font-size:12px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}h1{font-size:35px;margin:12px 0 7px;line-height:1.05}.hero p{margin:0 0 16px;color:#ddd;line-height:1.65;font-size:14px}.meta{display:flex;gap:12px;color:#d5d5d5;font-size:13px;align-items:center}.star{color:var(--gold);font-size:17px}.watch{border:0;border-radius:14px;background:var(--red);padding:12px 20px;font-weight:900;margin-top:16px;cursor:pointer;box-shadow:0 9px 22px #e7192d44}
    .telegram{margin:16px 12px;padding:14px;border:1px solid #2a87b9;border-radius:18px;background:linear-gradient(100deg,#09344d,#0e1b27);display:flex;gap:12px;align-items:center}.telegram i{font-style:normal;width:45px;height:45px;display:grid;place-items:center;background:#2ba4dc;border-radius:50%;font-size:23px}.telegram b{display:block;font-size:15px}.telegram small{display:block;color:#c7d2dc;margin-top:5px}.telegram button{margin-right:auto;border:0;border-radius:11px;padding:9px 14px;background:#2ba4dc;font-weight:bold;cursor:pointer}
    .section{padding:8px 12px 10px}.head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 14px}.head h2{margin:0;font-size:22px}.head h2::before{content:"";display:inline-block;width:5px;height:25px;margin-left:9px;border-radius:4px;background:var(--red);vertical-align:-5px}.head button{border:0;background:transparent;color:#ed6572;cursor:pointer}
    .feature-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}.wide{min-width:215px;height:116px;border:0;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(135deg,#19445e,#12101a);cursor:pointer;text-align:right}.wide:nth-child(2){background:linear-gradient(135deg,#571a26,#1d1728)}.wide:nth-child(3){background:linear-gradient(135deg,#1b5b46,#121b1d)}.wide span{position:absolute;bottom:10px;right:11px;font-weight:900;text-shadow:0 1px 6px #000}.wide::after{content:"▶";position:absolute;left:10px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0008;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:0;padding:0;background:transparent;color:white;text-align:right;cursor:pointer;min-width:0}.poster{aspect-ratio:2/3;border-radius:15px;overflow:hidden;position:relative;background:#272a34}.poster::before{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(150deg,transparent 40%,#000b);pointer-events:none}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .num{position:absolute;z-index:2;bottom:-12px;left:3px;font-size:62px;font-weight:900;font-style:italic;color:#fff;text-shadow:2px 2px #000;line-height:1}.poster .type{position:absolute;z-index:2;right:8px;top:8px;border-radius:7px;padding:4px 6px;background:#000a;font-size:10px}.p1{background:linear-gradient(150deg,#88634a,#1d2d38 65%,#101114)}.p2{background:linear-gradient(150deg,#cd8452,#593020 48%,#171112)}.p3{background:linear-gradient(150deg,#466280,#101c32 55%,#090d13)}.p4{background:linear-gradient(150deg,#603345,#251725 58%,#100b10)}.p5{background:linear-gradient(150deg,#8f7132,#2a1c11 60%,#0f0d0a)}.p6{background:linear-gradient(150deg,#3b846e,#15291f 60%,#0d120f)}.title{font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:7px 2px 3px}.sub{font-size:11px;color:var(--muted);margin:0 2px}.loading{grid-column:1/-1;padding:28px 8px;color:var(--muted);text-align:center}.loading::before{content:"";display:inline-block;width:18px;height:18px;margin-left:9px;vertical-align:-4px;border:2px solid #ffffff22;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .nav{position:fixed;z-index:30;bottom:0;right:0;left:0;max-width:680px;margin:auto;padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#0b0c11f2;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#8e9098;display:grid;gap:4px;place-items:center;font-size:10px;cursor:pointer}.nav i{font-size:22px;font-style:normal}.nav .active{color:var(--red)}
    .drawer,.modal{position:fixed;inset:0;z-index:50;display:none}.drawer.open,.modal.open{display:block}.backdrop{position:absolute;inset:0;background:#000a;backdrop-filter:blur(8px)}.menu{position:absolute;right:0;top:0;bottom:0;width:min(84%,360px);background:#101218;padding:calc(20px + env(safe-area-inset-top)) 17px 20px;box-shadow:-15px 0 40px #0008;animation:slide .22s ease-out}.menu-top{display:flex;align-items:center;gap:11px;padding-bottom:20px;border-bottom:1px solid var(--line);font-size:20px;font-weight:900}.menu-logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#f5c95b,#b77a15);color:#160e00;font-size:29px}.mi{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:16px;padding:15px 8px;text-align:right;font-size:17px;cursor:pointer}.mi i{font-size:21px;font-style:normal;width:27px;text-align:center}.mi:hover{background:#ffffff08;border-radius:11px}.divider{height:1px;background:var(--line);margin:11px 0}@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
    .dialog{position:absolute;right:16px;left:16px;top:50%;transform:translateY(-50%);border-radius:25px;padding:29px 22px;text-align:center;background:#1c1d20;box-shadow:0 22px 60px #000a}.dialog .warn{font-size:44px}.dialog h3{font-size:27px;margin:10px 0 18px}.dialog p{color:#c8c8ca;line-height:2;font-size:15px;margin:0 0 24px}.dialog button{width:100%;border:0;border-radius:14px;padding:14px;background:var(--red);font-size:18px;font-weight:900;cursor:pointer}.watch-sheet{position:absolute;inset:0;overflow:auto;background:#0b0c11;padding:calc(15px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.watch-close{position:sticky;top:0;z-index:3;margin-right:auto;display:block;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#1d1f28;font-size:20px;cursor:pointer}.watch-body{max-width:680px;margin:8px auto}.watch-body h2{font-size:24px;margin:17px 0 7px}.watch-meta{color:var(--muted);font-size:13px;margin-bottom:15px}.player{aspect-ratio:16/9;background:#000;border-radius:17px;overflow:hidden}.player video,.player iframe{width:100%;height:100%;border:0;background:#000}.watch-actions{display:flex;gap:8px;margin:13px 0}.watch-actions button,.watch-actions a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px;background:var(--red);font-weight:bold;cursor:pointer}.watch-actions a{background:#242630;color:white}.watch-description{color:#c5c6cb;line-height:1.8;font-size:14px}.episodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.episode{border:1px solid var(--line);border-radius:10px;padding:10px 7px;background:#1a1c25;font-size:12px;cursor:pointer}.watch-loading{min-height:65vh;display:grid;place-items:center;color:var(--muted)}
    @media(min-width:681px){body{background:#040508}.app{box-shadow:0 0 80px #000}.hero{border-radius:0 0 28px 28px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand"><span class="logo">🐆</span><span>الفهد TV</span></div><div class="actions"><button class="icon" aria-label="المفضلة">♡</button><button class="icon" aria-label="الإشعارات">♧</button><button class="icon" onclick="toggleMenu()" aria-label="القائمة">☰</button></div></header>
    <section class="hero"><div class="hero-art"></div><div class="hero-copy"><span class="tag"><i class="pulse"></i> مختارات الفهد</span><h1>ليلة في المدينة</h1><p>دراما مشوقة في تجربة مشاهدة سريعة ومصممة لهاتفك.</p><div class="meta"><span>2026</span><span>•</span><span>دراما</span><span class="star">★ 8.4</span></div><button class="watch" onclick="showToast('تم تجهيز صفحة المشاهدة التجريبية')">▶ شاهد الآن</button></div></section>
    <aside class="telegram"><i>➤</i><div><b>قناة الفهد الجديدة</b><small>تابع أحدث الإضافات والإعلانات على تيليجرام</small></div><button onclick="showToast('سيتم إضافة رابط القناة')">اشترك</button></aside>
    <section class="section"><div class="head"><h2>مقترح لك</h2><button>عرض الكل</button></div><div class="feature-row"><button class="wide"><span>أفلام عربية جديدة</span></button><button class="wide"><span>مسلسلات حصرية</span></button><button class="wide"><span>أقوى الأنمي</span></button></div></section>
    <section class="section"><div class="head"><h2>أفلام رائجة</h2><button>عرض الكل</button></div><div class="grid" id="movieGrid"></div></section>
    <section class="section"><div class="head"><h2>مسلسلات تستحق المشاهدة</h2><button>عرض الكل</button></div><div class="grid" id="seriesGrid"></div></section>
  </div>
  <nav class="nav"><button class="active"><i>⌂</i>الرئيسية</button><button onclick="showToast('قسم المسلسلات قريبًا')"><i>▣</i>المسلسلات</button><button onclick="showToast('قسم الأفلام قريبًا')"><i>▰</i>الأفلام</button><button onclick="showToast('قسم القنوات قريبًا')"><i>▻</i>القنوات</button><button onclick="showToast('ابحث في مكتبة الفهد')"><i>⌕</i>بحث</button></nav>
  <div class="drawer" id="drawer"><div class="backdrop" onclick="toggleMenu()"></div><aside class="menu"><div class="menu-top"><span class="menu-logo">🐆</span><span>الفهد TV</span></div><button class="mi"><i>⌂</i>الرئيسية</button><button class="mi"><i>▣</i>المسلسلات</button><button class="mi"><i>▰</i>الأفلام</button><button class="mi"><i>◉</i>الأنمي</button><button class="mi"><i>▻</i>القنوات</button><button class="mi"><i>⚽</i>مباريات اليوم</button><div class="divider"></div><button class="mi"><i>⌕</i>البحث</button><button class="mi"><i>♡</i>المفضلة</button><button class="mi" onclick="openDialog('about')"><i>⚙</i>الإعدادات</button><div class="divider"></div><button class="mi" onclick="openDialog('disclaimer')"><i>⚠</i>إخلاء المسؤولية</button><button class="mi"><i>↗</i>مشاركة التطبيق</button></aside></div>
  <div class="modal" id="modal"><div class="backdrop" onclick="closeDialog()"></div><article class="dialog"><div class="warn" id="dialogIcon">⚠</div><h3 id="dialogTitle"></h3><p id="dialogText"></p><button onclick="closeDialog()">حسنًا</button></article></div>
  <div class="modal" id="watchModal"><article class="watch-sheet"><button class="watch-close" onclick="closeWatch()" aria-label="إغلاق">×</button><div class="watch-body" id="watchBody"></div></article></div>
  <script>
    const WORKER='https://akwam-stream-fetcher.meroo3292.workers.dev/';
    const SOURCES={movies:'https://akwam.it/movies',series:'https://akwam.it/series',arabic:'https://akwam.it/movies?section=29'};
    const badTitle=/^(اكوام|إشعارات اكوام|موقع اكوام القديم|web stats)$/i;
    const safe=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return''}};
    const escapeHtml=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const catalogs={movies:[],series:[]};let currentMedia='',featuredIndex=0,featuredTimer=null;
    function cards(items, kind){return items.map((item,i)=>{const image=safe(item.img);const title=escapeHtml(item.title||'بدون عنوان'),label=kind==='movies'?'فيلم':kind==='series'?'مسلسل':'نتيجة بحث';return `<button class="card" onclick="openItem('${kind}',${i})"><div class="poster p${i%6+1}">${image?`<img loading="lazy" src="${escapeHtml(image)}" alt="${title}" onerror="this.remove()">`:''}<span class="type">${label}</span>${kind==='movies'?`<b class="num">${i+1}</b>`:''}</div><div class="title">${title}</div><div class="sub">متاح الآن على الفهد TV</div></button>`}).join('')}
    function showFeatured(item){if(!item)return;document.querySelector('.hero h1').textContent=item.title||'مختارات الفهد';document.querySelector('.hero p').textContent='أحدث الإضافات متاحة الآن في مكتبة الفهد.';const poster=safe(item.img),art=document.querySelector('.hero-art');if(poster){art.style.backgroundImage=`linear-gradient(90deg,#08090dbd,transparent 78%),url("${poster}")`;art.style.backgroundSize='cover';art.style.backgroundPosition='center';art.style.opacity='.78';}}
    function startFeatured(items){clearInterval(featuredTimer);featuredIndex=0;showFeatured(items[featuredIndex]);const suggestions=document.querySelectorAll('.feature-row .wide');suggestions.forEach((card,index)=>{const poster=safe(items[(index+1)%items.length]?.img);if(poster){card.style.backgroundImage=`linear-gradient(0deg,#0009,transparent),url("${poster}")`;card.style.backgroundSize='cover';card.style.backgroundPosition='center'}});featuredTimer=setInterval(()=>{featuredIndex=(featuredIndex+1)%items.length;showFeatured(items[featuredIndex])},3000)}
    async function loadSection(kind, gridId){const grid=document.querySelector(gridId);try{const url=WORKER+'?'+new URLSearchParams({action:'genre',genre:SOURCES[kind]});const response=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});const payload=await response.json();if(!response.ok||payload.status==='error')throw new Error();const items=(Array.isArray(payload.data)?payload.data:[]).filter(item=>safe(item.href)&&!badTitle.test(String(item.title||'').trim())).slice(0,12);if(!items.length)throw new Error();catalogs[kind]=items;grid.innerHTML=cards(items,kind);if(kind==='movies')startFeatured(items);}catch{grid.innerHTML='<div class="loading">تعذر تحميل المحتوى الآن</div>'}}
    document.querySelector('#movieGrid').innerHTML='<div class="loading">جاري تحميل الأفلام</div>';document.querySelector('#seriesGrid').innerHTML='<div class="loading">جاري تحميل المسلسلات</div>';Promise.all([loadSection('movies','#movieGrid'),loadSection('series','#seriesGrid')]);
    function toggleMenu(){document.querySelector('#drawer').classList.toggle('open')}
    function openDialog(kind){toggleMenu();const about=kind==='about';document.querySelector('#dialogIcon').textContent=about?'🐆':'⚠';document.querySelector('#dialogTitle').textContent=about?'عن تطبيق الفهد TV':'إخلاء المسؤولية';document.querySelector('#dialogText').textContent=about?'الفهد TV يقدم لك واجهة مشاهدة سريعة وسهلة للاستخدام، بتصميم مخصص للموبايل وتحديثات مستمرة.':'يعرض التطبيق المحتوى الذي تملك حقوق عرضه أو المصرح لك باستخدامه فقط. يجب ربط هذه الواجهة بمصادر محتوى قانونية ومرخصة.';document.querySelector('#modal').classList.add('open')}
    function closeDialog(){document.querySelector('#modal').classList.remove('open')}
    async function openItem(kind,index){const item=catalogs[kind]?.[index];if(item)openLink(item.href,item.title)}
    async function openLink(href,fallbackTitle='الحلقة'){const clean=safe(href);if(!clean)return;const modal=document.querySelector('#watchModal'),body=document.querySelector('#watchBody');modal.classList.add('open');document.body.style.overflow='hidden';body.innerHTML='<div class="watch-loading">جاري تجهيز المشاهدة…</div>';try{const response=await fetch(WORKER+'?'+new URLSearchParams({action:'series',series:clean}),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok||data.status==='error')throw new Error();await showWatch(data,fallbackTitle)}catch{body.innerHTML='<div class="watch-loading">تعذر تجهيز المشاهدة الآن. حاول مرة أخرى.</div>'}}
    async function playbackUrl(url){const clean=safe(url);if(!clean)return'';try{const host=new URL(clean).hostname.toLowerCase();if(host==='downet.net'||host.endsWith('.downet.net')){const response=await fetch(WORKER+'?'+new URLSearchParams({action:'sign',url:clean}),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();return safe(data.url)||''}}catch{}return clean}
    async function showWatch(data,fallbackTitle){const body=document.querySelector('#watchBody');const title=escapeHtml(data.movie_title||fallbackTitle||'بدون عنوان');const original=safe(data.media_src);const media=data.is_iframe?original:await playbackUrl(original);const download=safe(data.download_src)||original;const description=escapeHtml(data.description||'');const isFrame=Boolean(data.is_iframe);currentMedia=media;const player=media?(isFrame?`<div class="player"><iframe src="${escapeHtml(media)}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe></div>`:`<div class="player"><video controls playsinline preload="metadata" src="${escapeHtml(media)}"></video></div>`):'<div class="watch-loading">تعذر تجهيز مصدر المشاهدة. حاول مرة أخرى.</div>';const episodes=Array.isArray(data.episodes)?data.episodes:[];body.innerHTML=`<h2>${title}</h2><div class="watch-meta">الفهد TV • مشاهدة بجودة عالية</div>${player}${media?`<div class="watch-actions"><button onclick="playCurrent()">▶ تشغيل</button>${download?`<a href="${escapeHtml(download)}" target="_blank" rel="noopener">↓ تحميل</a>`:''}</div>`:''}${description?`<p class="watch-description">${description}</p>`:''}${episodes.length?`<h3>الحلقات</h3><div class="episodes">${episodes.map(e=>`<button class="episode" onclick="openLink(decodeURIComponent('${encodeURIComponent(String(e.link||''))}'),'الحلقة ${escapeHtml(e.num||'')}')">الحلقة ${escapeHtml(e.num||'')}</button>`).join('')}</div>`:''}`}
    function playCurrent(){const video=document.querySelector('#watchBody video');if(video)video.play().catch(()=>{})}
    function closeWatch(){document.querySelector('#watchModal').classList.remove('open');document.querySelector('#watchBody').innerHTML='';document.body.style.overflow=''}
    function remember(screen){if(history.state?.screen===screen)return;history.pushState({screen},'',`#/${screen}`);window.NativeNavigation?.setBackEnabled(true)}
    function showHome(){window.NativeNavigation?.setBackEnabled(false);const movieSection=document.querySelector('#movieGrid').closest('.section'),seriesSection=document.querySelector('#seriesGrid').closest('.section');movieSection.classList.remove('hidden');seriesSection.classList.remove('hidden');movieSection.querySelector('.head h2').textContent='أفلام رائجة';window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('.nav button').forEach((button,index)=>button.classList.toggle('active',index===0))}
    function goToSection(kind){if(kind==='home'){showHome();return}remember(kind);const movieSection=document.querySelector('#movieGrid').closest('.section'),seriesSection=document.querySelector('#seriesGrid').closest('.section');movieSection.classList.toggle('hidden',kind==='series');seriesSection.classList.toggle('hidden',kind==='movies');const target=kind==='series'?seriesSection:movieSection;target.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button').forEach((button,index)=>button.classList.toggle('active',(kind==='movies'&&index===2)||(kind==='series'&&index===1)))}
    async function openArabic(){remember('arabic');const grid=document.querySelector('#movieGrid'),section=grid.closest('.section');section.classList.remove('hidden');document.querySelector('#seriesGrid').closest('.section').classList.add('hidden');section.querySelector('.head h2').textContent='أفلام عربية جديدة';grid.innerHTML='<div class="loading">جاري تحميل الأفلام العربية</div>';try{const response=await fetch(WORKER+'?'+new URLSearchParams({action:'genre',genre:SOURCES.arabic}),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();const items=(Array.isArray(data.data)?data.data:[]).filter(item=>safe(item.href)&&!badTitle.test(String(item.title||'').trim())).slice(0,24);catalogs.arabic=items;grid.innerHTML=items.length?cards(items,'arabic'):'<div class="loading">لا توجد أعمال متاحة الآن</div>';section.scrollIntoView({behavior:'smooth',block:'start'});}catch{grid.innerHTML='<div class="loading">تعذر تحميل الأفلام العربية</div>'}}
    function openFeatured(){if(catalogs.movies[0])openLink(catalogs.movies[0].href,catalogs.movies[0].title);else showToast('جاري تحميل المحتوى')}
    async function openSearch(){const modal=document.querySelector('#watchModal'),body=document.querySelector('#watchBody');modal.classList.add('open');document.body.style.overflow='hidden';body.innerHTML='<h2>البحث</h2><div class="watch-meta">ابحث عن فيلم أو مسلسل</div><input id="searchInput" autofocus placeholder="اكتب اسم العمل..." style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff18;background:#1a1c25;color:white;font:inherit"><div id="searchResults" class="grid" style="margin-top:16px"></div>';document.querySelector('#searchInput').addEventListener('input',async event=>{const query=event.target.value.trim(),results=document.querySelector('#searchResults');if(query.length<2){results.innerHTML='';return}results.innerHTML='<div class="loading">جاري البحث</div>';try{const response=await fetch(WORKER+'?'+new URLSearchParams({action:'search',q:query,p:1}),{headers:{Accept:'application/json'},cache:'no-store'});const payload=await response.json();const items=(Array.isArray(payload.data)?payload.data:[]).filter(item=>safe(item.href)&&!badTitle.test(String(item.title||'').trim())).slice(0,24);catalogs.search=items;results.innerHTML=items.length?cards(items,'search'):'<div class="loading">لا توجد نتائج</div>'}catch{results.innerHTML='<div class="loading">تعذر تنفيذ البحث</div>'}})}
    document.querySelector('.watch').onclick=openFeatured;document.querySelectorAll('.feature-row .wide')[0].onclick=openArabic;document.querySelectorAll('.feature-row .wide')[1].onclick=()=>goToSection('series');document.querySelectorAll('.feature-row .wide')[2].onclick=()=>{openSearch();setTimeout(()=>{const input=document.querySelector('#searchInput');if(input){input.value='انمي';input.dispatchEvent(new Event('input'))}},100)};document.querySelectorAll('.head button')[1].onclick=()=>goToSection('movies');document.querySelectorAll('.head button')[2].onclick=()=>goToSection('series');document.querySelectorAll('.nav button')[0].onclick=()=>goToSection('home');document.querySelectorAll('.nav button')[1].onclick=()=>goToSection('series');document.querySelectorAll('.nav button')[2].onclick=()=>goToSection('movies');document.querySelectorAll('.nav button')[4].onclick=openSearch;
    function showToast(message){const el=document.createElement('div');el.textContent=message;el.style.cssText='position:fixed;z-index:70;bottom:95px;right:50%;transform:translateX(50%);background:#25262b;color:white;padding:12px 18px;border-radius:13px;box-shadow:0 9px 28px #0008;font-weight:bold;white-space:nowrap';document.body.append(el);setTimeout(()=>el.remove(),2300)}
  </script>
<script>
  const FOOTBALL_API='https://al-fahd-api-production.up.railway.app/v1/football/matches';
  const arabCountries=new Set(['Saudi Arabia','Egypt','Morocco','Algeria','Tunisia','Qatar','United Arab Emirates','Iraq','Jordan','Kuwait','Bahrain','Oman','Palestine','Libya','Sudan','Syria','Lebanon','Yemen']);
  function footballMatch(match){const kickoff=new Date(match.date);const time=Number.isNaN(kickoff)?'—':kickoff.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});const score=match.status&&match.status!=='Not Started'&&match.status!=='TBD'?`${match.home.score??0} - ${match.away.score??0}`:time;return `<article style="padding:13px;border:1px solid #ffffff12;border-radius:14px;background:#171922;margin-bottom:9px"><div style="font-size:11px;color:#a7a9b2;margin-bottom:9px">${escapeHtml(match.league.name)} • ${escapeHtml(match.league.country)}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:9px;font-weight:bold"><span style="text-align:center;flex:1">${escapeHtml(match.home.name)}</span><b style="color:#f2b640;white-space:nowrap">${score}</b><span style="text-align:center;flex:1">${escapeHtml(match.away.name)}</span></div><div style="text-align:center;color:#a7a9b2;font-size:11px;margin-top:8px">${escapeHtml(match.status||'لم تبدأ')}</div></article>`}
  async function openFootball(){const modal=document.querySelector('#watchModal'),body=document.querySelector('#watchBody');modal.classList.add('open');document.body.style.overflow='hidden';body.innerHTML='<h2>⚽ مباريات اليوم</h2><div class="watch-meta">جاري تحميل المباريات العربية والعالمية…</div><div class="watch-loading">جاري التحميل</div>';try{const response=await fetch(FOOTBALL_API,{cache:'no-store'});const data=await response.json();if(!response.ok||data.status!=='success')throw new Error();const matches=Array.isArray(data.matches)?data.matches:[];const arab=matches.filter(m=>arabCountries.has(m.league.country));const world=matches.filter(m=>!arabCountries.has(m.league.country));body.innerHTML=`<h2>⚽ مباريات اليوم</h2><div class="watch-meta">${escapeHtml(data.date)} • تحديث مباشر للجدول والنتائج</div><h3>المباريات العربية</h3>${arab.length?arab.map(footballMatch).join(''):'<p class="watch-description">لا توجد مباريات عربية مسجلة اليوم.</p>'}<h3 style="margin-top:24px">المباريات العالمية</h3>${world.slice(0,80).map(footballMatch).join('')||'<p class="watch-description">لا توجد مباريات مسجلة اليوم.</p>'}`;}catch{body.innerHTML='<div class="watch-loading">تعذر تحميل المباريات. حاول مرة أخرى لاحقًا.</div>'}}
  const footballNav=document.querySelectorAll('.nav button')[3];footballNav.innerHTML='<i>⚽</i>مباريات';footballNav.onclick=openFootball;
  const drawerItems=document.querySelectorAll('.mi');if(drawerItems[5])drawerItems[5].onclick=()=>{toggleMenu();openFootball()};
  document.querySelector('.actions .icon[onclick]')?.remove();
  document.querySelector('#drawer')?.remove();
  document.querySelector('.top')?.remove();
  history.replaceState({screen:'home'},'',location.hash||'#/home');
  window.addEventListener('popstate',showHome);
  new MutationObserver(()=>{const actions=document.querySelector('.watch-actions');if(actions&&!actions.querySelector('.fullscreen-action')){const button=document.createElement('button');button.className='fullscreen-action';button.textContent='⛶ تكبير';button.onclick=()=>{const video=document.querySelector('#watchBody video');if(video?.requestFullscreen)video.requestFullscreen();};actions.append(button);}}).observe(document.querySelector('#watchBody'),{childList:true,subtree:true});
  document.querySelector('#watchBody').addEventListener('click',event=>{const download=event.target.closest('.watch-actions a');if(!download)return;event.preventDefault();if(!currentMedia){showToast('تعذر تجهيز رابط التحميل');return}if(window.AndroidPlayer?.download){window.AndroidPlayer.download(currentMedia);showToast('بدأ تحميل ملف الفيديو');}else window.open(currentMedia,'_blank','noopener');});
</script>
