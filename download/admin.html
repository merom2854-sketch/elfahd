<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة محتوى الفهد TV</title>
<style>body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif;padding:24px}main{max-width:720px;margin:auto;background:#151923;border-radius:20px;padding:22px}h1{margin-top:0}label{display:block;margin:12px 0 6px;color:#aeb4c2}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #323848;border-radius:10px;background:#0f1219;color:#fff;font-size:15px}button{background:#ef233c;border:0;font-weight:700;cursor:pointer;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #303644;padding:14px 0;display:flex;gap:12px;align-items:center}.item img{width:48px;height:68px;object-fit:cover;border-radius:7px}.item button{width:auto;background:#323848;margin:0;padding:8px 12px}.muted{color:#9aa1b2;font-size:13px;line-height:1.6}.status{margin-top:14px;color:#61e294}.error{color:#ff7888}</style>
<main><h1>إدارة محتوى الفهد TV</h1><p class="muted">الإدارة تعمل مباشرة مع ملفّات الموقع، بدون Railway. أدخل GitHub fine-grained token بصلاحية <b>Contents: Read and write</b> لمستودع <b>merom2854-sketch/elfahd</b>. الرمز يبقى في هذه الصفحة فقط ولا يُحفظ.</p>
<label>GitHub access token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
<label>اسم العمل</label><input id="title" placeholder="مثال: فيلم جديد">
<div class="row"><div><label>رابط صفحة المصدر</label><input id="href" placeholder="https://akwam.it/movie/..." /></div><div><label>رابط الصورة</label><input id="image" placeholder="https://..." /></div></div>
<div class="row"><div><label>النوع</label><select id="kind"><option value="movie">فيلم</option><option value="series">مسلسل</option><option value="anime">أنمي</option></select></div><div><label>التصنيف</label><input id="category" placeholder="أكشن / عربي / أجنبي" /></div></div>
<label><input id="featured" type="checkbox" style="width:auto"> يظهر في الرئيسية</label><button onclick="save()">إضافة المحتوى</button><div id="status" class="status"></div><h2>المحتوى اليدوي</h2><div id="list" class="muted">جار التحميل…</div>
<h2>إرسال إشعار</h2><label>عنوان الإشعار</label><input id="noticeTitle" placeholder="فيلم جديد متاح الآن"><label>نص الإشعار</label><input id="noticeBody" placeholder="شاهد أحدث الإضافات على الفهد TV"><label>رابط داخلي اختياري</label><input id="deepLink" placeholder="رابط الفيلم أو القسم"><button onclick="notify()">نشر الإشعار</button>
</main>
<script>
const $=id=>document.getElementById(id),repo='merom2854-sketch/elfahd',branch='main',manualPath='data/manual-content.json',noticePath='data/notifications.json';
const html=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const apiPath=path=>`https://api.github.com/repos/${repo}/contents/${path}`;
const bytesToText=value=>decodeURIComponent(Array.from(atob(value.replace(/\n/g,''))).map(char=>'%'+char.charCodeAt(0).toString(16).padStart(2,'0')).join(''));
const textToBytes=value=>btoa(unescape(encodeURIComponent(value)));
function token(){return $('token').value.trim()} function setStatus(message,error=false){$('status').textContent=message;$('status').className=error?'status error':'status'}
async function getFile(path,authenticated=false){const headers={Accept:'application/vnd.github+json'};if(authenticated){if(!token())throw new Error('أدخل GitHub access token أولاً');headers.Authorization='Bearer '+token()}const response=await fetch(apiPath(path)+'?ref='+branch,{headers,cache:'no-store'});if(!response.ok)throw new Error('تعذر الوصول للملف ('+response.status+')');const file=await response.json();return {sha:file.sha,json:JSON.parse(bytesToText(file.content))}}
async function writeFile(path,json,message){const current=await getFile(path,true),response=await fetch(apiPath(path),{method:'PUT',headers:{Accept:'application/vnd.github+json','Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({message,content:textToBytes(JSON.stringify(json,null,2)+'\n'),sha:current.sha,branch})});if(!response.ok){const problem=await response.json().catch(()=>({}));throw new Error(problem.message||'تعذر حفظ التغيير')}}
async function load(){try{const file=await getFile(manualPath),items=Array.isArray(file.json.data)?file.json.data:[];$('list').innerHTML=items.map(item=>`<div class="item"><img src="${html(item.image||'')}" alt=""><div style="flex:1"><b>${html(item.title)}</b><div class="muted">${html(item.kind)} · ${html(item.category||'بدون تصنيف')}</div></div><button onclick="removeItem('${html(item.id)}')">حذف</button></div>`).join('')||'<p>لا يوجد محتوى يدوي</p>'}catch(error){$('list').textContent=error.message}}
async function save(){try{const title=$('title').value.trim(),href=$('href').value.trim();if(!title||!/^https:\/\//i.test(href))throw new Error('أدخل الاسم ورابط HTTPS صحيح');const file=await getFile(manualPath,true),items=Array.isArray(file.json.data)?file.json.data:[],item={id:crypto.randomUUID(),title,href,image:$('image').value.trim(),kind:$('kind').value,category:$('category').value.trim(),featured:$('featured').checked,createdAt:new Date().toISOString()};file.json.data=[item,...items];await writeFile(manualPath,file.json,'admin: add '+title);['title','href','image','category'].forEach(id=>$(id).value='');setStatus('تم الحفظ. يصل للتطبيق بعد اكتمال نشر الموقع خلال لحظات.');load()}catch(error){setStatus(error.message,true)}}
async function removeItem(id){if(!confirm('حذف هذا المحتوى؟'))return;try{const file=await getFile(manualPath,true);file.json.data=(file.json.data||[]).filter(item=>item.id!==id);await writeFile(manualPath,file.json,'admin: remove content');setStatus('تم الحذف.');load()}catch(error){setStatus(error.message,true)}}
async function notify(){try{const title=$('noticeTitle').value.trim(),body=$('noticeBody').value.trim();if(!title||!body)throw new Error('أدخل عنوان ونص الإشعار');const file=await getFile(noticePath,true);file.json.data={id:crypto.randomUUID(),title,body,deepLink:$('deepLink').value.trim(),createdAt:new Date().toISOString()};await writeFile(noticePath,file.json,'admin: publish notification');setStatus('تم نشر الإشعار. التطبيق يلتقطه في الفحص القادم.')}catch(error){setStatus(error.message,true)}}
load();
</script>
